name: Build PBRP for PJA110

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install repo launcher
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync PBRP Android 14 source
        working-directory: ${{ runner.temp }}
        run: |
          mkdir pbrp
          cd pbrp
          "$HOME/bin/repo" init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b android-14.0
          "$HOME/bin/repo" sync -c --force-sync --no-clone-bundle --no-tags -j8

      - name: Add PJA110 device tree
        run: |
          mkdir -p "${{ runner.temp }}/pbrp/device/oneplus/pja110"
          rsync -a --delete --exclude='.git' --exclude='.github' ./ "${{ runner.temp }}/pbrp/device/oneplus/pja110/"

      - name: Fix Android 14 recovery vendor layout
        working-directory: ${{ runner.temp }}/pbrp
        run: |
          # Android 14's generic root owns /vendor as a symlink to /system/vendor.
          # PBRP still installs a few recovery-only files into a real /vendor,
          # which makes the final ramdisk rsync fail when it creates that symlink.
          sed -i \
            's#$(TARGET_RECOVERY_ROOT_OUT)/vendor#$(TARGET_RECOVERY_ROOT_OUT)/system/vendor#g' \
            bootable/recovery/etc/Android.mk \
            bootable/recovery/prebuilt/Android.mk
          if grep -R '\$(TARGET_RECOVERY_ROOT_OUT)/vendor' \
              bootable/recovery/etc/Android.mk \
              bootable/recovery/prebuilt/Android.mk; then
            echo 'Unpatched recovery /vendor output remains' >&2
            exit 1
          fi

      - name: Build recovery image
        working-directory: ${{ runner.temp }}/pbrp
        env:
          ALLOW_MISSING_DEPENDENCIES: "true"
        run: |
          source build/envsetup.sh
          lunch pb_pja110-eng
          # The PBRP fork does not skip Soong's own Go unit tests by default.
          # They add several minutes and are unrelated to this device image.
          mka pbrp --skip-soong-tests -j4

      - name: Collect and validate image
        run: |
          out="${{ runner.temp }}/pbrp/out/target/product/pja110"
          image="$(find "$out" -maxdepth 1 -type f -name 'PitchBlack*.img' -print -quit)"
          if [ -z "$image" ]; then image="$out/recovery.img"; fi
          test -f "$image"
          test "$(stat -c %s "$image")" -le 104857600
          cp "$image" PBRP-3.1.0-pja110-crDroid-Android17-20261118.img
          sha256sum PBRP-3.1.0-pja110-crDroid-Android17-20261118.img > PBRP-3.1.0-pja110-crDroid-Android17-20261118.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PBRP-3.1.0-pja110-crDroid-Android17-20261118
          path: |
            PBRP-3.1.0-pja110-crDroid-Android17-20261118.img
            PBRP-3.1.0-pja110-crDroid-Android17-20261118.sha256
          if-no-files-found: error
          retention-days: 14
